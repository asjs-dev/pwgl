<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PWGL visual E2E</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <aside>
      <h1>PWGL visual E2E</h1>
      <p id="adapter"></p>
      <nav id="cases"></nav>
    </aside>
    <main>
      <header>
        <div>
          <h2 id="title"></h2>
          <p id="expectation"></p>
        </div>
        <div class="actions">
          <button id="render-once">Render once</button>
          <button id="stress-render">Render 120×</button>
          <button id="context-loss">Lose/restore context</button>
          <button id="copy-report">Copy report</button>
        </div>
      </header>
      <section id="viewport"></section>
      <section id="metrics">
        <div class="metrics-heading">
          <h3>Render metrics</h3>
          <span id="instrumentation-status"></span>
        </div>
        <div class="metrics-table-wrapper">
          <table>
            <thead>
              <tr>
                <th>Phase</th>
                <th>Renders</th>
                <th>Time</th>
                <th>Pixels</th>
                <th>Buffers C/D</th>
                <th>Buffer binds</th>
                <th>bufferData</th>
                <th>bufferSubData</th>
                <th>Attrib E/P/D</th>
                <th>Programs C/L/U</th>
                <th>VAOs C/B</th>
                <th>Draws</th>
              </tr>
            </thead>
            <tbody id="metrics-body"></tbody>
          </table>
        </div>
        <details>
          <summary>Copyable report preview</summary>
          <pre id="report"></pre>
        </details>
      </section>
      <footer>
        <span id="status">Ready</span>
        <span id="gl-error"></span>
      </footer>
    </main>
    <script type="module" src="./main.js"></script>
  </body>
</html>
